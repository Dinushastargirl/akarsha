spring:
  datasource:
    # H2 in PostgreSQL compat mode — no external DB required for tests
    url: jdbc:h2:mem:akarsha;MODE=PostgreSQL;DATABASE_TO_LOWER=true;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      # Rely on Flyway for schema and seed data
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true

# Use a fixed, deterministic JWT secret for tests
jwt:
  secret: test-akarsha-super-secure-secret-key-that-is-at-least-256-bits-long
