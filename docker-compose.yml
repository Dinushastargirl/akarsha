version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: akarsha-postgres
    environment:
      POSTGRES_DB: akarsha
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: akarsha-backend
    ports:
      - "8090:8090"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/akarsha
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - JWT_SECRET=local-development-secret-key-that-is-at-least-256-bits-long
      - SPRING_PROFILES_ACTIVE=dev
    depends_on:
      - postgres

volumes:
  pgdata:
