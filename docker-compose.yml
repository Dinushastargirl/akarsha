version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: akarsha-postgres
    environment:
      POSTGRES_DB: akarsha
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
